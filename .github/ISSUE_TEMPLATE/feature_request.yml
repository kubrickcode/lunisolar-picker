name: Feature request
description: Suggest a new prop, picker or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and why don't the current props or parts cover it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
